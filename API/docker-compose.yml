services:
  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_DB: adhd
      POSTGRES_USER: adhd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - planner-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhd -d adhd"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build:
      context: .
      target: build
    entrypoint: ["dotnet", "ef", "database", "update", "--project", "src/Adhd.Infrastructure", "--startup-project", "src/Adhd.Api", "--configuration", "Release", "--no-build"]
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      ConnectionStrings__Planner: Host=db;Database=adhd;Username=adhd;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    restart: unless-stopped
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      ASPNETCORE_ENVIRONMENT: Production
      # Hosttaki ters vekil API'ye bu ağın geçidinden bağlanır. Gerçek istemci IP'si yalnız ondan kabul edilir
      ReverseProxy__KnownProxies__0: ${REVERSE_PROXY_IP:-${API_GATEWAY:-172.30.80.1}}
      Cloudinary__Enabled: ${Cloudinary__Enabled:-false}
      Cloudinary__CloudName: ${Cloudinary__CloudName:-}
      Cloudinary__ApiKey: ${Cloudinary__ApiKey:-}
      Cloudinary__ApiSecret: ${Cloudinary__ApiSecret:-}
      ConnectionStrings__Planner: Host=db;Database=adhd;Username=adhd;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
networks:
  default:
    ipam:
      config:
        - subnet: ${API_SUBNET:-172.30.80.0/24}
          gateway: ${API_GATEWAY:-172.30.80.1}
volumes:
  planner-data:
