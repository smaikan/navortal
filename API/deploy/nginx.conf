events {}
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
    log_format safe '$request_id $remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    # nginx error messages can include a raw request line. Keep query credentials out of this channel too.
    error_log /dev/null;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 0;
        location /api/ {
            set $backend http://api:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 70s;
        }
        location /health/ { set $backend http://api:8080; proxy_pass $backend; }
        # UI is a later delivery. Add the Next.js upstream here when UI/ exists.
        location / { return 404; }
    }
}
